<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">سامانه جامع مدیریت پیمانکاری</title>
  <desc id="desc">اینفوگرافی فارسی از قابلیت‌های فعلی سامانه ERP پیمانکاری</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#eef6f7"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="value" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="0.55" stop-color="#164e63"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0f766e" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#12304a" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#12304a" flood-opacity="0.1"/>
    </filter>
    <style>
      .fa { font-family: Tahoma, Arial, sans-serif; }
      .card-title { font-size: 29px; font-weight: 700; fill: #17324d; }
      .icon-stroke { fill: none; stroke: #f97316; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .value-text { font-size: 24px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="880" fill="url(#grid)"/>

  <!-- Subtle construction skyline -->
  <g opacity="0.055" fill="#12304a">
    <path d="M0 785h155V662h38v-58h44v58h42v123h128V574h48v-72h48v72h40v211h141V635h52v-86h54v86h48v150h167V528h52v-92h62v92h51v257h130V623h44v-67h54v67h47v162h173v-95h66v-63h75v158h155v95H0z"/>
    <path d="M1510 180h13v441h-13zM1453 196h422v13h-422zM1520 183l190-96 7 12-190 96zM1707 91h13v105h-13z"/>
  </g>

  <!-- Header -->
  <g class="fa">
    <text x="1780" y="92" text-anchor="end" font-size="54" font-weight="800" fill="#12304a">سامانه جامع مدیریت پیمانکاری</text>
    <text x="1780" y="145" text-anchor="end" font-size="30" font-weight="500" fill="#46647d">کنترل یکپارچه پروژه، منابع، عملیات و مالی</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="120" y="66" width="315" height="62" rx="31" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <circle cx="397" cy="97" r="15" fill="#22c55e"/>
    <path d="M390 97l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="fa" x="250" y="107" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">قابلیت‌های فعلی سیستم</text>
  </g>
  <path d="M120 178H1800" stroke="#d7e3e8" stroke-width="2"/>

  <!-- Connector network -->
  <g fill="none" stroke="#6ba6a1" stroke-opacity="0.45" stroke-width="4">
    <path d="M600 293C740 293 748 366 815 415"/>
    <path d="M600 430C730 430 755 446 795 466"/>
    <path d="M600 567C730 567 755 539 795 520"/>
    <path d="M600 704C740 704 755 625 820 577"/>
    <path d="M1320 293C1180 293 1172 366 1105 415"/>
    <path d="M1320 430C1190 430 1165 446 1125 466"/>
    <path d="M1320 567C1190 567 1165 539 1125 520"/>
    <path d="M1320 704C1180 704 1165 625 1100 577"/>
  </g>
  <g fill="#f97316">
    <circle cx="600" cy="293" r="6"/><circle cx="600" cy="430" r="6"/><circle cx="600" cy="567" r="6"/><circle cx="600" cy="704" r="6"/>
    <circle cx="1320" cy="293" r="6"/><circle cx="1320" cy="430" r="6"/><circle cx="1320" cy="567" r="6"/><circle cx="1320" cy="704" r="6"/>
  </g>

  <!-- Central ERP hub -->
  <g filter="url(#shadow)">
    <circle cx="960" cy="500" r="186" fill="#ffffff"/>
    <circle cx="960" cy="500" r="164" fill="url(#hub)"/>
    <circle cx="960" cy="500" r="141" fill="none" stroke="#72d3c9" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 10"/>
  </g>
  <g transform="translate(906 382)" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 68h100v78H8z"/>
    <path d="M22 68V43h72v25M33 43V20h50v23"/>
    <path d="M27 88h18v18H27zM58 88h18v18H58zM89 88h1M27 119h18v27M58 119h18v27M89 119h1"/>
    <path d="M17 20h82" stroke="#fb923c"/>
  </g>
  <text class="fa" x="960" y="587" text-anchor="middle" font-size="33" font-weight="800" fill="#ffffff">هسته یکپارچه سامانه</text>
  <g fill="#fb923c">
    <circle cx="960" cy="330" r="7"/><circle cx="1130" cy="500" r="7"/><circle cx="960" cy="670" r="7"/><circle cx="790" cy="500" r="7"/>
  </g>

  <!-- Left cards -->
  <g filter="url(#softShadow)">
    <rect x="120" y="238" width="480" height="110" rx="24" fill="#ffffff" stroke="#dce8ec" stroke-width="2"/>
    <rect x="120" y="375" width="480" height="110" rx="24" fill="#ffffff" stroke="#dce8ec" stroke-width="2"/>
    <rect x="120" y="512" width="480" height="110" rx="24" fill="#ffffff" stroke="#dce8ec" stroke-width="2"/>
    <rect x="120" y="649" width="480" height="110" rx="24" fill="#ffffff" stroke="#dce8ec" stroke-width="2"/>
  </g>
  <g>
    <circle cx="535" cy="293" r="38" fill="#fff7ed"/>
    <g class="icon-stroke" transform="translate(510 268)"><path d="M4 48V20l20-14 20 14v28M13 48V27h22v21M20 35h8M20 42h8"/></g>
    <text class="fa card-title" x="315" y="304" text-anchor="middle">پروژه و کنترل پروژه</text>

    <circle cx="535" cy="430" r="38" fill="#fff7ed"/>
    <g class="icon-stroke" transform="translate(510 405)"><path d="M6 16h37M10 16v31M39 16v31M4 47h41M13 8h23l7 8H6z"/><path d="M19 25h14M19 34h14"/></g>
    <text class="fa card-title" x="315" y="441" text-anchor="middle">برآورد، قرارداد و مالی</text>

    <circle cx="535" cy="567" r="38" fill="#fff7ed"/>
    <g class="icon-stroke" transform="translate(510 542)"><path d="M4 8h8l5 25h22l6-17H15M21 41a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM38 41a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></g>
    <text class="fa card-title" x="315" y="578" text-anchor="middle">خرید و تأمین</text>

    <circle cx="535" cy="704" r="38" fill="#fff7ed"/>
    <g class="icon-stroke" transform="translate(510 679)"><path d="M4 21l21-13 21 13v26H4zM13 47V30h24v17M19 35h12M19 42h12"/></g>
    <text class="fa card-title" x="315" y="715" text-anchor="middle">انبار و مصالح</text>
  </g>

  <!-- Right cards -->
  <g filter="url(#softShadow)">
    <rect x="1320" y="238" width="480" height="110" rx="24" fill="#ffffff" stroke="#dce8ec" stroke-width="2"/>
    <rect x="1320" y="375" width="480" height="110" rx="24" fill="#ffffff" stroke="#dce8ec" stroke-width="2"/>
    <rect x="1320" y="512" width="480" height="110" rx="24" fill="#ffffff" stroke="#dce8ec" stroke-width="2"/>
    <rect x="1320" y="649" width="480" height="110" rx="24" fill="#ffffff" stroke="#dce8ec" stroke-width="2"/>
  </g>
  <g>
    <circle cx="1385" cy="293" r="38" fill="#fff7ed"/>
    <g class="icon-stroke" transform="translate(1360 268)"><circle cx="17" cy="16" r="9"/><path d="M3 47c1-12 7-18 14-18s13 6 14 18M34 19h12M40 13v12M36 33l5 5 8-10"/></g>
    <text class="fa card-title" x="1585" y="304" text-anchor="middle">نیروی انسانی و تجهیزات</text>

    <circle cx="1385" cy="430" r="38" fill="#fff7ed"/>
    <g class="icon-stroke" transform="translate(1360 405)"><path d="M12 6h26v8h7v34H5V14h7zM16 25h18M16 34h18M16 43h12"/><path d="M18 6v8h14V6"/></g>
    <text class="fa card-title" x="1585" y="441" text-anchor="middle">گزارش روزانه کارگاه</text>

    <circle cx="1385" cy="567" r="38" fill="#fff7ed"/>
    <g class="icon-stroke" transform="translate(1360 542)"><path d="M25 4l20 8v14c0 12-8 20-20 25C13 46 5 38 5 26V12z"/><path d="M15 27l7 7 14-16"/></g>
    <text class="fa card-title" x="1605" y="578" text-anchor="middle" font-size="23">ایمنی، کیفیت و اقدامات اصلاحی</text>

    <circle cx="1385" cy="704" r="38" fill="#fff7ed"/>
    <g class="icon-stroke" transform="translate(1360 679)"><path d="M4 14h18l5 6h19v27H4zM10 8h20l5 6"/><path d="M16 34l6 6 13-14"/></g>
    <text class="fa card-title" x="1585" y="715" text-anchor="middle">اسناد نسخه‌دار و کارتابل</text>
  </g>

  <!-- Value ribbon -->
  <g filter="url(#shadow)">
    <rect x="120" y="830" width="1680" height="176" rx="32" fill="url(#value)"/>
  </g>
  <text class="fa" x="1740" y="884" text-anchor="end" font-size="27" font-weight="800" fill="#fdba74">ارزش برای سازمان</text>
  <path d="M1200 862v112M810 862v112M420 862v112" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <g class="fa value-text" text-anchor="middle">
    <g>
      <circle cx="1500" cy="921" r="22" fill="#ffffff" fill-opacity="0.12"/>
      <path d="M1490 922l7 7 14-17" fill="none" stroke="#fdba74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1500" y="970">تصمیم‌گیری سریع‌تر</text>
    </g>
    <g>
      <circle cx="1005" cy="921" r="22" fill="#ffffff" fill-opacity="0.12"/>
      <path d="M995 922l7 7 14-17" fill="none" stroke="#fdba74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1005" y="970">شفافیت و ردیابی کامل</text>
    </g>
    <g>
      <circle cx="615" cy="921" r="22" fill="#ffffff" fill-opacity="0.12"/>
      <path d="M605 922l7 7 14-17" fill="none" stroke="#fdba74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="615" y="970">دقت مالی و کنترل هزینه</text>
    </g>
    <g>
      <circle cx="270" cy="921" r="22" fill="#ffffff" fill-opacity="0.12"/>
      <path d="M260 922l7 7 14-17" fill="none" stroke="#fdba74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="270" y="970" font-size="21">امنیت و تفکیک اطلاعات</text>
    </g>
  </g>
</svg>
