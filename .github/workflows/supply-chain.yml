name: CEP-013 supply-chain gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-gate:
    runs-on: ubuntu-24.04
    container:
      image: python@sha256:8fb0b110b022c70cbe09d3ff1fb313654f31f9c814abb0d48180af56d906a199
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PIP_CONFIG_FILE: /dev/null
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install approved Debian libpq runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libpq5
          dpkg-query -W -f='${Package}\t${Version}\n' libpq5 libc6 libgssapi-krb5-2 libldap-2.5-0 libssl3
      - name: Validate exact sets and lock integrity
        run: python scripts/supply_chain.py check-locks
      - name: Acquire, scan, and review exact runtime wheels
        run: python scripts/supply_chain.py gate --wheelhouse output/cep-013/ci-wheelhouse --output output/cep-013/ci-gate
      - name: Install exact wheels offline in the approved Linux target
        run: |
          python -m pip install --require-hashes --only-binary=:all: --ignore-installed --no-index \
            --find-links output/cep-013/ci-wheelhouse/prod --target /tmp/cep013-runtime \
            -r requirements-prod-linux.lock
          PYTHONPATH=/tmp/cep013-runtime python -c 'import django, psycopg; print(django.get_version(), psycopg.__version__)'
      - name: Focused and configuration regression in isolated development set
        run: |
          python -m pip install --require-hashes --only-binary=:all: --ignore-installed --no-index \
            --find-links output/cep-013/ci-wheelhouse/dev --target /tmp/cep013-dev \
            -r requirements-dev-linux.lock
          PYTHONPATH=/tmp/cep013-dev python -m pytest tests/test_supply_chain.py -q
          PYTHONPATH=/tmp/cep013-dev python -m ruff check scripts/supply_chain.py tests/test_supply_chain.py
          PYTHONPATH=/tmp/cep013-dev python manage.py check
      - name: Archive immutable wheelhouse and evidence
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf output/cep-013/ci-wheelhouse.tar.gz \
            -C output/cep-013 ci-wheelhouse ci-gate
          (cd output/cep-013 && sha256sum ci-wheelhouse.tar.gz > ci-wheelhouse.sha256)
      - name: Attest wheelhouse provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: output/cep-013/ci-wheelhouse.tar.gz
      - name: Retain pass or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cep013-supply-chain-evidence
          path: |
            output/cep-013/ci-gate/
            output/cep-013/ci-wheelhouse.sha256
            output/cep-013/ci-wheelhouse.tar.gz
          if-no-files-found: error

  verify-provenance:
    needs: dependency-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cep013-supply-chain-evidence
          path: evidence
      - name: Verify signed provenance and immutable archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd evidence
          sha256sum --check ci-wheelhouse.sha256
          gh attestation verify ci-wheelhouse.tar.gz --repo "$GITHUB_REPOSITORY"
