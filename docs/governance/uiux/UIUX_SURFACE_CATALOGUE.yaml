inventory_rules:
- Inventory first; formal findings follow evidence.
- Do not infer role authorization from route naming.
- Do not infer exact page title from function or route name.
- Generic transition/action endpoints are retained separately to support workflow UX audit.
- When runtime evidence shows materially different role/state experiences on one route, split the surface into variants.
- A UI finding never authorizes domain, permission, workflow, persistence, or authority changes.
