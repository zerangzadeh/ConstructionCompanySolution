  status: STATIC_COVERAGE_REVIEW_READY
  purpose: Authoritative static inventory of material V1 user-facing screen candidates for the BONIRA UI/UX Audit. Static
    route discovery does not prove runtime reachability, role visibility, exact page title, or usability.
  repository: zerangzadeh/ConstructionCompanySolution
  branch: main
  audit_baseline_commit: 43ac319c6e73e48ca9626461b73987922c498ec3
  local_po_path: E:\Construction_Company_Solution
