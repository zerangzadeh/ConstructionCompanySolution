form_intelligence_audit_rules:
  status: ACTIVE_DURING_FULL_AUDIT
  field_classification:
  - USER_DECISION
  - SELECT_EXISTING_DATA
  - CASCADE_FILTERED
  - SYSTEM_DERIVED
  - CONTEXT_DEFAULTED
  - READ_ONLY_INFORMATION
  - ADVANCED_SPECIALIST
  - HIDDEN_TECHNICAL
  rules:
  - Do not ask the user to re-enter data already known from the authenticated user, organization, active context, parent record
    or selected business object.
  - Prefer authorized selection from existing business data over free-text identifiers or names.
  - Dependent choices must be narrowed as early as possible, not merely rejected after submission.
  - System-generated integrity, idempotency, version and provenance values should not be ordinary user inputs.
  - UI narrowing never replaces authoritative server-side permission, tenant and relationship validation.
home_dashboard_audit_rules:
  status: ACTIVE_DURING_FULL_AUDIT
  dimensions:
  - ROLE_AWARENESS
  - TASK_PRIORITIZATION
  - ALERT_EXCEPTION_VISIBILITY
  - RECENT_RELEVANT_WORK
  - CONTEXT_CLARITY
  - VISUAL_HIERARCHY
  - ENTERPRISE_PROFESSIONALISM
  - RESPONSIVENESS
  - ACTIONABILITY
  reference_design_policy: Product Owner draft designs may be used as reference evidence; they are not mandatory pixel specifications.
