  core_view_source: core/views.py
  included_url_modules: 32
  screen_candidates: 383
  auxiliary_or_action_routes: 221
  modules_with_screen_candidates: 33
  limitations:
  - Exact Persian page titles are intentionally pending template/runtime confirmation.
  - Role visibility is intentionally empty until permission/runtime evidence is reviewed.
  - Some create/review routes may combine GET and POST behavior; pilot audit will calibrate classification.
  - Django Admin generated model pages are represented as one administration surface and are not expanded here.
  - Static route existence is not proof that a page is reachable for a real role in a running environment.
