schema_version: '1.2'
document:
  id: BONIRA-UIUX-REFERENCE-PERSONA-CATALOGUE
  status: APPROVED_GOVERNANCE_CATALOGUE_RECONCILED
  approved_at: '2026-10-21'
  checkpoint: UIUX_REFERENCE_PERSONA_DOCUMENTATION_RECONCILIATION_CHECKPOINT_15.md
  purpose: Persistent reusable BONIRA UI/UX reference persona catalogue with reconciled existing identities, readiness state,
    and non-binding target aliases.
governance:
  persona_is_not_role: true
  reference_personas_are_persistent: true
  delete_after_validation: false
  automatic_deactivation_after_validation: false
  persian_display_title_required: false
  credentials_must_not_be_stored_here: true
  authority_must_be_evidence_based: true
  authority_must_not_be_broadened_to_force_pass: true
  production_provisioning_is_not_implied: true
  ui_visibility_requirement:
    required: true
    intended_surface: Governed administration/reference-persona catalogue
    minimum_visible_fields:
    - persona_id or stable username
    - provisioning/readiness state
    - organization/context summary
    - role/scope summary
    - validation coverage/readiness state
    forbidden_visible_secrets:
    - password
    - token
    - session
    - cookie
    - csrf secret
    display_label_language_requirement: NONE
  display_label_policy: No Persian display-title requirement. UI may use stable username/persona ID; human-readable display
    labels are optional.
  alias_policy: Existing identities are retained for evidence continuity. Proposed uiux.persona.* aliases are not naming requirements
    and must not trigger duplicate account creation.
  historical_evidence_mutation: FORBIDDEN_FOR_RECONCILIATION
  cleanup_supersession_document: runtime_evidence/RETENTION_SUPERSESSION_CHECKPOINT_15.md
