codex_execution_contract:
  goal: Close the remaining findings, not rerun the UI/UX audit.
  entry_rules:
  - Repository-ground against the current working tree before mutation. Treat accepted dirty UI/UX remediation as the effective baseline; do not
    reset/revert accepted prior work.
  - Read this master plus the original finding record and referenced runtime/closure evidence before touching each finding.
  - Revalidate the current source/UI first. If the defect is already absent, do not rewrite code; record ALREADY_RESOLVED_CURRENT_SOURCE with
    evidence and close only after verification.
  - Never infer that Wave completion means Finding closure.
  action_semantics:
    SKIP_RESOLVED: Do not mutate for this finding unless a current regression is directly demonstrated.
    REVALIDATE_THEN_REMEDIATE: Confirm the defect still exists, implement the minimum bounded UI/UX fix, then test and runtime-verify.
    REVALIDATE_THEN_COMPLETE: Existing remediation/observation is incomplete or lacks explicit closure; verify current behavior first, then finish
      only the missing scope.
    REVALIDATE_AND_RECLASSIFY: Do not implement until current applicability is established; close/reclassify with evidence if no longer applicable.
    STOP_FOR_PRODUCT_DECISION: Do not invent product semantics or implement a redesign. Produce the smallest Human Product Decision question and
      stop only this finding/batch dependency.
    RESOLVE_BLOCKER_THEN_REMEDIATE: Resolve only the documented prerequisite under existing authority; do not bypass authorization/test-data/domain
      contracts.
  bounded_change_rules:
  - No authorization architecture redesign, permission broadening, tenant/project/site isolation weakening, or impersonation.
  - No business-rule, workflow-state-machine, financial-rule, statutory-rule, or policy semantics changes unless separately authorized.
  - No schema/migration change merely to improve presentation; if a finding truly requires one, stop and report the reason.
  - Technical identifiers may remain in explicit audit/advanced disclosures when required; they should not dominate ordinary task UI.
  - Preserve Persian-first RTL, Jalali/date contracts, IRR/LTR numeric handling, existing server-side validation, CSRF, and object-scope checks.
  - Do not create fake business data solely to force a PASS unless a separately governed fixture plan explicitly allows it.
  - Development / Non-Production only. No Production deployment/cutover/certification.
  - No Git add/commit/push/merge/rebase/reset/clean/stash unless the Human explicitly authorizes it.
  batching_policy:
  - Work in small batches sharing a root pattern and touch set; do not mutate all remaining findings in one pass.
  - Prefer shared-component fixes when they safely resolve multiple findings, but enumerate every affected finding and run affected regressions.
  - Before each batch, list included finding IDs, files/touch set, expected behavior, and stop conditions.
  - After each batch, update only the affected entries in this master and append an execution_history record; preserve historical evidence.
  minimum_closure_evidence_per_finding:
  - Current-source reproduction or explicit proof the defect is already absent.
  - Exact code/template/form delta or explicit no-code reclassification basis.
  - Focused tests/checks appropriate to the touched surface.
  - Affected regression tests for shared components or cross-module changes.
  - Authenticated browser/runtime verification for user-visible interaction/presentation findings where feasible.
  - Authorization/tenant isolation negative checks when a UI change touches scoped selectors or permission-conditioned surfaces.
  - No unresolved attributable regression.
  closure_rule: Set master_status=RESOLVED only when the finding-specific problem and recommendation scope are satisfied with evidence. A partial
    improvement, representative observation, or passing Wave scenario is not enough.
  stop_conditions:
  - A new Product Decision is required.
  - Authorization/business/domain semantics would need to change.
  - A migration/schema change appears necessary.
  - Current evidence conflicts materially with this master or the canonical finding record.
  - The proposed shared fix has an unbounded blast radius.
recommended_execution_order:
  phase_1: P0 HIGH findings with REVALIDATE_THEN_REMEDIATE / REVALIDATE_THEN_COMPLETE, grouped by shared root pattern and touch set.
  phase_2: P1 MEDIUM findings, again grouped by shared pattern.
  phase_3: REVIEW_FOR_RECLASSIFICATION items.
  human_hold: PRODUCT_DECISION_REQUIRED items remain isolated until a Human decision is recorded.
  final_gate: All findings must be RESOLVED, formally reclassified/not-applicable with evidence, or explicitly Human-deferred before claiming
    UI/UX finding closure.
