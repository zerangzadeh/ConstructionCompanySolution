  problem: The search experience is framed around authorization semantics («جستجوی مجاز», «نتایج مجاز») rather than the user's search task, and
    its empty-state copy contains «نتیجه مجازی یافت نشد».
  user_impact: Users repeatedly see permission language instead of a simple statement of what can be searched; the «مجازی» wording also reads
    as a copy defect.
