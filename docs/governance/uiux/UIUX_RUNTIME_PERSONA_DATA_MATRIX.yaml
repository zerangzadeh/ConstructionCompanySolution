schema_version: '1.5'
document:
  id: BONIRA-UIUX-RUNTIME-PERSONA-DATA-MATRIX
  title: BONIRA UI/UX Runtime Persona and Test-Data Matrix
  status: PLAN_RECONCILED_WITH_REFERENCE_PERSONA_IDENTITIES
  audit_baseline_commit: 43ac319c6e73e48ca9626461b73987922c498ec3
  canonical_path: docs/governance/uiux/UIUX_RUNTIME_PERSONA_DATA_MATRIX.yaml
  revised_at: '2026-10-21'
  revision_checkpoint: UIUX_REFERENCE_PERSONA_DOCUMENTATION_RECONCILIATION_CHECKPOINT_15.md
rules:
- Persona is a test archetype, not a new BONIRA role.
- Map each persona to existing actual permissions/memberships before execution.
- Do not infer authority from job title, navigation visibility or historical role names.
- Use a non-production organization and disposable/reversible records for mutating scenarios.
- Never record passwords, tokens or secrets in audit artefacts.
- Tenant Owner, Tenant Admin and Platform Admin are distinct authority/persona shapes; never collapse them for convenience.
- A single human may hold more than one real authority, but runtime evidence must record the effective authority used for
  the tested journey.
- Project Manager is distinct from an operational project user because managerial oversight, exception handling and approvals
  create materially different UX needs.
- Document Controller is a distinct construction-ERP persona because document/version/linking journeys are not adequately
  represented by Knowledge curation.
- Prefer least-privileged identities for ordinary journeys; do not use Owner or Platform Admin merely because they can reach
  more pages.
- Do not combine Inventory/Storekeeping with Equipment/Fleet merely because both concern physical assets.
- 'Do not combine Timekeeping with Payroll: source preparation and payroll calculation/review are materially different journeys
  and authorities.'
- Do not combine HSE/Safety with Quality/QA-QC when validating lifecycle, terminology or permissions.
- Employment-record/decree management and employee self-view are separate perspectives; if a management surface is absent,
  record a product-coverage question rather than inventing a route.
- External Supplier/Partner portal users are not ordinary tenant members and require separate isolation evidence.
- Contract/Commercial administration is not equivalent to Procurement buying or Billing settlement.
- Provisioned reference personas are persistent governed identities and must not be deleted or automatically deactivated merely
  because validation completed.
- Persona credentials and secrets must never be stored in persona governance documents or displayed in the reference-persona
  UI.
- Reference persona accounts may be reused across future waves/regressions after permissions, scope and scenario data are
  re-verified.
- Reference personas do not require a Persian display title in the product UI; a stable technical identifier/username is sufficient,
  while a human-readable label may be shown when available.
