governance_boundary:
  this_is: UI/UX audit runtime validation plan
  this_is_not:
  - CEP-078 execution
  - CEP-079 UAT execution
  - Production Certification
  - Human Sign-off
  - remediation authorization
  persona_rule: Persona names are runtime test archetypes, not new BONIRA roles. Map each archetype to actual non-production
    identity/membership/portal grant, effective permissions and object scope before its scenario. Do not infer authority from
    title, navigation or broad privileged access. Tenant Owner, Tenant Admin and Platform Admin remain distinct; Timekeeping/Payroll,
    Safety/Quality, Inventory/Equipment and Contract/Billing perspectives must not be collapsed.
  canonical_verification_separation:
    CEP-078:
      title: Browser, accessibility and responsive runtime verification
      relationship: TOPIC_OVERLAP_ONLY
      rule: This UI/UX audit matrix is not CEP-078 execution evidence. It may be reused as planning input only if CEP-078
        later passes its own canonical entry conditions and is explicitly executed under its own evidence/manifest requirements.
    CEP-079:
      title: Representative UAT execution
      relationship: SEPARATE_UAT_PROGRAM
      rule: These 33 audit scenarios do not replace, reduce, or claim execution of the canonical 44 representative UAT scenarios
        owned by CEP-079.
evidence_requirements:
- exact baseline/build SHA
- persona identity and effective organization/project/site context
- desktop screenshot(s)
- mobile or narrow viewport screenshot(s) where applicable
- keyboard-only interaction notes
- visible labels/actions/state
- network/request evidence only where cascade or partial-refresh behavior is under test
- server-side authorization result for protected actions
- finding IDs confirmed, disproved or refined
