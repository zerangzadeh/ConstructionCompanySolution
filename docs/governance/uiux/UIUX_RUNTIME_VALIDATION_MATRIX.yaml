  name: Baseline identity
  pass_condition: The runtime build SHA is known and either exactly equals the audit baseline 43ac319c6e73e48ca9626461b73987922c498ec3
    or a new audit baseline is explicitly frozen and the static artefacts are reconciled before execution.
  status: PASS_FROM_ENTRY_REVIEW
- gate_id: RV-GATE-01
  name: Non-production runtime environment
  pass_condition: A reachable Development/Test runtime exists, production is excluded, and browser evidence can be captured
    without mutating production data.
  status: PASS_FROM_ENTRY_REVIEW
- gate_id: RV-GATE-02
  name: Persona identities and effective permissions
  pass_condition: Each scenario persona is mapped to an actual test user/membership with known effective permissions and object
    scope. Job title or UI visibility is never treated as authority.
  status: PARTIAL_SCENARIO_SCOPED_RECHECK_REQUIRED
  note: Previously proven identities/data remain valid only for their proven scenarios. P-15..P-26 and targeted scenarios
    added by Checkpoints 11-12 require scenario-specific identity/data readiness.
- gate_id: RV-GATE-03
  name: Scenario data readiness
  pass_condition: Required projects/sites/contracts/workflow states/financial records/ESS records exist in safe test data,
    with IDs recorded only in the private execution record.
  status: PARTIAL_SCENARIO_SCOPED_RECHECK_REQUIRED
  note: Previously proven identities/data remain valid only for their proven scenarios. P-15..P-26 and targeted scenarios
    added by Checkpoints 11-12 require scenario-specific identity/data readiness.
- gate_id: RV-GATE-04
  name: Mutation safety
  pass_condition: Scenarios that create or transition records are confirmed safe, reversible or disposable, with no production,
    certification, statutory activation or irreversible action.
  status: PASS_FROM_ENTRY_REVIEW
- gate_id: RV-GATE-05
  name: Evidence capture readiness
  pass_condition: Screenshot naming, viewport matrix, keyboard notes, expected result, actual result and finding disposition
    format are prepared before the first scenario.
  status: PASS_FROM_ENTRY_REVIEW
result_vocabulary:
- PASS
- FAIL_UIUX
- FAIL_ACCESSIBILITY
- FAIL_RESPONSIVE
- FAIL_PERMISSION_OR_SCOPE
- NEEDS_DOMAIN_REVIEW
- BLOCKED_ENVIRONMENT
- BLOCKED_TEST_DATA
- BLOCKED_AUTHORIZATION_FIXTURE
- NEEDS_PRODUCT_REVIEW
- UTV
finding_handling:
  existing_finding_confirmed: Link scenario evidence to existing UIUX-F-###; do not create duplicate.
  existing_finding_disproved: Mark finding for reclassification only after evidence review; do not silently delete history.
  new_uiux_defect: Create next UIUX-F-### with runtime evidence.
  business_or_domain_suspect: Classify NEEDS_DOMAIN_REVIEW; do not change business semantics.
  security_or_scope_failure: Stop the affected scenario, retain evidence, and escalate separately; UI hiding is not authorization.
  remediation: Not permitted during validation. Record and continue only where safe.
  persona_or_role_coverage_gap: Treat as a validation-plan coverage issue. Add/adjust persona or targeted runtime scenario
    without inventing a product role or altering authorization.
  missing_user_journey_or_surface: If a persona-critical governed capability exists in services/domain logic but no usable
    product surface is discoverable, record NEEDS_PRODUCT_REVIEW. Do not invent a route, silently classify it as a UI defect,
    or mutate product scope.
  reference_persona_catalogue_missing: If no governed UI exists to view persistent reference personas with Persian display
    titles, record NEEDS_PRODUCT_REVIEW / planned product gap. Do not infer that the governance catalogue alone satisfies
    the UI requirement.
