schema_version: '1.0'
document:
  id: BONIRA-UIUX-REFERENCE-PATTERN-CATALOGUE
  title: BONIRA UI/UX Positive Reference Pattern Catalogue
  status: AUDIT_IN_PROGRESS
  repository: zerangzadeh/ConstructionCompanySolution
  branch: main
  audit_baseline_commit: 43ac319c6e73e48ca9626461b73987922c498ec3
  canonical_path: docs/governance/uiux/UIUX_REFERENCE_PATTERN_CATALOGUE.yaml
purpose: Identify existing BONIRA patterns that should be preserved or reused during remediation instead of redesigning every
  surface from scratch.
patterns:
- reference_id: REF-P01-STATE_AWARE_NEXT_ACTION
  name_fa: اقدام بعدی متناسب با وضعیت
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - templates/safety/detail.html
  - templates/quality/detail.html
  strengths:
  - The detail page explicitly labels «اقدام بعدی».
  - Only the action valid for the current state and permission is rendered.
  - Closed records clearly become non-editable.
  - The business journey is visible without exposing the entire state machine as buttons.
  reuse_for:
  - Procurement RFQ
  - Payroll
  - Fixed Assets
  - Equipment
  - Subledgers
- reference_id: REF-P02-CANONICAL-PAGE-HEADER
  name_fa: سربرگ صفحه با Breadcrumb و Primary Action
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - templates/components/page_header.html
  strengths:
  - Single page title hierarchy.
  - Optional breadcrumb and eyebrow.
  - Single primary page action.
  - Responsive behavior is centralized.
  reuse_for:
  - List pages
  - Create entry points
  - Workspaces
- reference_id: REF-P03-ACTIONABLE-EMPTY-STATE
  name_fa: وضعیت خالی با اقدام بعدی
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - templates/components/empty_state.html
  - templates/projects/list.html
  - templates/inventory/warehouse_list.html
  strengths:
  - Explains what is absent.
  - Can explain what the user should do next.
  - Supports a single contextual primary action.
  reuse_for:
  - Payroll
  - ESS
  - Search
  - Operational workspaces
- reference_id: REF-P04-PROCUREMENT-STATE_SCOPED_ACTIONS
  name_fa: عملیات خرید متناسب با وضعیت و مجوز
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - templates/procurement/request_detail.html
  - templates/procurement/order_detail.html
  - templates/procurement/receipt_detail.html
  strengths:
  - Actions are conditioned by record status and permission.
  - Destructive actions are visually separated or de-emphasized.
  - Primary business object details remain readable.
  - The page does not expose the entire workflow state machine at once.
  reuse_for:
  - RFQ buyer workspace
  - Other approval/detail surfaces
- reference_id: REF-P05-HR-EMPLOYEE-LIST
  name_fa: فهرست کارمند وظیفه‌محور و ساده
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - templates/workforce/employee_list.html
  strengths:
  - Clear page purpose and single creation CTA.
  - Human-readable identity, department/position/team and localized status.
  - Actionable empty state uses the shared component.
  - No governance or implementation terminology dominates the page.
  reuse_for:
  - Master-data list pages
  - Operational catalogues
- reference_id: REF-P06-DAILY-REPORT-CREATE
  name_fa: فرم چندبخشی بر اساس کار کاربر
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - templates/daily_reports/create.html
  strengths:
  - Fields are grouped into project scope, report conditions, work/progress and observations.
  - 'Primary action is task-specific: «ذخیره پیش‌نویس».'
  - Shared form components and form-error component are used.
  - The page explains the reporting task in business language.
  reuse_for:
  - Long operational forms
  - HR/Payroll forms
  - Compliance forms
- reference_id: REF-P07-EXPENSE-CONTEXT_CASCADE
  name_fa: فیلتر آبشاری و پیش‌فرض Context در فرم هزینه
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - apps/expenses/forms.py
  strengths:
  - Project choices can be scoped to the membership.
  - The active project can prefill the Project field.
  - Phase choices are narrowed to the selected project.
  - The Phase widget declares a context-options URL for cascade refresh.
  - Server-side validation still checks the Project/Phase relationship.
  reuse_for:
  - Daily Report Project→Site→Phase
  - Equipment Project→Site
  - Payroll Project→Site
  - Procurement Project→Purchase Request
  - other context-dependent forms
- reference_id: REF-P08-BILLING-CONTEXT_SETTLEMENT
  name_fa: انتخاب تسویه محدودشده با Context کسب‌وکار
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - apps/billing/forms.py
  strengths:
  - Claim settlement offers only posted Treasury receipts.
  - Movement choices are narrowed by claim Project and Contract Party.
  - Reversal/reversed movements are excluded.
  - The idempotency key is generated by the system rather than entered by the user.
  reuse_for:
  - Subledgers settlement selection
  - Other cross-module reference selectors
- reference_id: REF-P09-COMMERCIAL-TENDER-STATE_AWARE
  name_fa: عملیات مناقصه تجاری محدود به وضعیت معتبر
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - apps/commercial/templates/commercial/tender_detail.html
  strengths:
  - Transition form is rendered only when policy is active and allowed targets exist.
  - Primary lifecycle action is separated from revision/evidence actions.
  - Inactive policy produces a clear blocking message.
  reuse_for:
  - RFQ buyer workflow
  - Other state-driven commercial workflows
- reference_id: REF-P10-SUPPORT-STATE_AWARE_TRANSITIONS
  name_fa: چرخه رسیدگی پشتیبانی با اقدام متناسب با وضعیت
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - apps/support/forms.py
  - apps/support/templates/support/case_detail.html
  strengths:
  - Transition choices are explicitly limited by current case status.
  - The expected current status is carried as a hidden concurrency/control value.
  - The user sees business action labels such as initial review, start handling, resolved and reopen.
  reuse_for:
  - Other case/work-item lifecycle surfaces
- reference_id: REF-P11-EMPLOYEE-KNOWN_DATA_REUSE
  name_fa: عدم ورود مجدد اطلاعات کارمند در صورت وجود حساب
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - apps/workforce/forms.py
  - templates/workforce/employee_form.html
  strengths:
  - The user can choose an existing organization account.
  - Shared personal data fields are hidden/disabled in that mode.
  - The page explicitly tells the user that known account data need not be entered again.
  - The server form also clears duplicated personal inputs when the account path is used.
  reuse_for:
  - Other forms that can derive data from an existing selected business object
- reference_id: REF-P12-WORKFORCE-PROJECT_SITE_CASCADE
  name_fa: فیلتر آبشاری پروژه به کارگاه در تخصیص نیروی انسانی
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - apps/workforce/forms.py
  - templates/workforce/assignment_form.html
  strengths:
  - Site is disabled until a Project is chosen.
  - Changing Project fetches only sites for that project.
  - The form queryset is also constrained by project on the server.
  - The UI provides loading, empty-precondition and failure states.
  reuse_for:
  - Accounting dimensions
  - Compliance Project→Site
  - Equipment Project→Site
  - Daily Reports Project→Site→Phase
- reference_id: REF-P13-TABLE_SORT_QUERY_PRESERVATION
  name_fa: حفظ وضعیت Query هنگام مرتب‌سازی جدول
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - core/templatetags/table_filters.py
  - templates/components/table_sort_header.html
  strengths:
  - Existing query parameters are copied before changing sort state.
  - Page is removed when sort changes, avoiding invalid page carry-over.
  - aria-sort and a keyboard-visible focus treatment are provided.
  reuse_for:
  - Pagination query preservation
  - Other table-state links
- reference_id: REF-P14-ACCOUNTING-JALALI_REPORTING
  name_fa: نمایش شمسی تاریخ در صورت‌های مالی حسابداری
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - apps/accounting/templates/accounting/statement_list.html
  - apps/accounting/templates/accounting/statement_detail.html
  strengths:
  - Stored report period dates use the shared jalali_date filter.
  - Stored-run timestamps use jalali_datetime.
  - Canonical hidden submission values remain Gregorian when required by the backend.
  reuse_for:
  - Billing lists/details
  - Safety/Quality dates
  - Accounting period list
- reference_id: REF-P15-WORKFORCE-ORG_CHART
  name_fa: نمای ساختار سازمانی حرفه‌ای با حالت درختی و لیستی
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - templates/workforce/department_list.html
  - templates/workforce/position_chart.html
  strengths:
  - Tree and list representations are both available for hierarchical data.
  - Search/filter controls are task-specific.
  - Department view includes zoom/fullscreen and a details drawer.
  - Position view supports department filtering and a table alternative.
  - Empty states and primary creation actions are present.
  reuse_for:
  - Workflow visualization
  - Other hierarchical master data
  - Professional Home/Dashboard visual language
- reference_id: REF-P16-SHARED-PAGINATION_QUERY_PRESERVATION
  name_fa: صفحه‌بندی با حفظ Query موجود
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - templates/components/table_pagination.html
  strengths:
  - Accepts a preserved `pagination_query` before appending the page value.
  - Supports previous, numbered and next navigation.
  - Marks the current page with aria-current.
  reuse_for:
  - bounded_table_pagination.html
  - All filtered/sorted list pagination
- reference_id: REF-P17-ESTIMATE-CONTEXT_CASCADE
  name_fa: فیلتر پروژه‌محور قرارداد و فاز در برآورد
  status: CONFIRMED_GOOD_REFERENCE
  source_paths:
  - apps/estimates/forms.py
  - templates/estimates/create.html
  strengths:
  - Project choices can be membership-scoped and active Project can prefill.
  - Contract and Phase choices are narrowed to the selected Project.
  - The shared context-options endpoint is declared for cascade refresh.
  - Server-side Project/Contract/Phase relationship validation is retained.
  - 'The submit action is task-specific: «ثبت برآورد».'
  reuse_for:
  - Accounting Project→Site/WBS
  - Billing dependent evidence
  - Treasury request context
  - Equipment dependent selectors
- reference_id: REF-P18-FINANCIAL-DASHBOARD_VISUAL_HIERARCHY
  name_fa: سلسله‌مراتب بصری داشبورد مالی
  status: CONFIRMED_GOOD_REFERENCE_PRESENTATION_ONLY
  source_paths:
  - templates/financials/dashboard.html
  strengths:
  - A strong hero/header area establishes context.
  - KPI cards have differentiated semantic emphasis rather than one flat card treatment.
  - A larger operational summary is visually separated from quick actions.
  - Financial values use shared numeric formatting and clear hierarchy.
  reuse_for:
  - Future role-aware Home/Dashboard composition
  caveat: This is a legacy compatibility financial surface. Reuse visual hierarchy only; do not reuse or reinterpret its legacy
    financial authority/data semantics.
- reference_id: REF-P19-LOGIN-POLISHED_AUTH_SURFACE
  name_fa: سطح ورود هویت‌دار و واکنش‌گرا
  status: CONFIRMED_GOOD_REFERENCE_PRESENTATION_ONLY
  source_paths:
  - templates/accounts/login.html
  strengths:
  - BONIRA-specific palette and branding are applied consistently.
  - Form controls have explicit focus, validation and password-toggle states.
  - Desktop and mobile layouts are intentionally designed.
  - Reduced-motion preferences are respected.
  reuse_for:
  - Visual polish benchmark for other high-visibility product surfaces
  caveat: Do not copy the page-specific inline CSS architecture; reuse only the product polish and interaction quality after
    shared-component normalization.
