<main id="main-content" tabindex="-1" class="mx-auto min-w-0 max-w-[1600px] px-4 py-5 sm:px-6 lg:px-8 lg:py-6">
            
 
<nav class="mb-3 flex items-center gap-2 text-[11px] text-slate-400" aria-label="مسیر صفحه">
    <a class="transition hover:text-blue-700" href="/">خانه</a>
    <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    
    <span class="truncate text-slate-600">محاسبه مقرراتی حقوق</span>
</nav>
<header class="erp-page-header" aria-labelledby="erp-page-title">
    <div class="erp-page-header__copy">
        
            <p class="text-xs font-semibold text-blue-600">حقوق و دستمزد محرمانه</p>
        
        <h1 id="erp-page-title" class="mt-1 text-2xl font-bold tracking-tight text-slate-950">محاسبه مقرراتی حقوق</h1>
        
            <p class="mt-1 text-sm text-slate-500">فقط اجرای قطعی و نسخه منتشرشده، منبع‌دار و بازبینی‌شده پلتفرم مصرف می‌شود.</p>
        
    </div>
    
</header>

<section class="erp-surface mx-auto mt-5 max-w-3xl rounded-2xl p-5 sm:p-7">
  <form method="post" class="space-y-4" novalidate>
    <!-- CSRF omitted -->
    
    
<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_run">
        اجرای قطعی<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <select name="run" required id="id_run">
  <option value="" selected>---------</option>

</select>
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_kind">
        نوع<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <select name="kind" id="id_kind">
  <option value="payroll_tax">مالیات حقوق</option>

  <option value="employee_insurance">بیمه کارکنان</option>

</select>
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_record_kind">
        نوع سابقه<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <select name="record_kind" id="id_record_kind">
  <option value="original">اصلی</option>

  <option value="correction">اصلاحی</option>

  <option value="cancellation">ابطالی</option>

</select>
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_corrects">
        سابقه قبلی
    </label>
    <select name="corrects" id="id_corrects">
  <option value="" selected>---------</option>

</select>
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_reason">
        دلیل
        <span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <textarea name="reason" cols="40" rows="3" required id="id_reason">
</textarea>
    
    
</div>

    <div class="flex flex-wrap gap-3 border-t border-slate-100 pt-5"><button class="erp-btn erp-btn--primary" type="submit">ثبت کنترل‌شده</button><a class="erp-btn erp-btn--secondary" href="/payroll/">بازگشت</a></div>
  </form>
</section>

        </main>
