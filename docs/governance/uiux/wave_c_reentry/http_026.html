<main id="main-content" tabindex="-1" class="mx-auto min-w-0 max-w-[1600px] px-4 py-5 sm:px-6 lg:px-8 lg:py-6">
            
 
<nav class="mb-3 flex items-center gap-2 text-[11px] text-slate-400" aria-label="مسیر صفحه">
    <a class="transition hover:text-blue-700" href="/">خانه</a>
    <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    
    <span class="truncate text-slate-600">تقویم کاری جدید</span>
</nav>
<header class="erp-page-header" aria-labelledby="erp-page-title">
    <div class="erp-page-header__copy">
        
            <p class="text-xs font-semibold text-blue-600">حضور و کارکرد</p>
        
        <h1 id="erp-page-title" class="mt-1 text-2xl font-bold tracking-tight text-slate-950">تقویم کاری جدید</h1>
        
            <p class="mt-1 text-sm text-slate-500">منطقه زمانی از تنظیمات شرکت خوانده می‌شود؛ مقدار قانونی یا تعطیلی پیش‌فرض ساخته نمی‌شود.</p>
        
    </div>
    
</header>

<section class="erp-surface mx-auto mt-5 max-w-3xl rounded-2xl p-5 sm:p-7">
  <form method="post" class="space-y-4" novalidate>
    <!-- CSRF omitted -->
    
    
<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_code">
        کد
        <span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <input type="text" name="code" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm" required id="id_code">
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_name">
        نام
        <span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <input type="text" name="name" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm" required id="id_name">
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_effective_from">
        شروع اعتبار<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <input type="date" name="effective_from" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm" required id="id_effective_from">
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_effective_to">
        پایان اعتبار
    </label>
    <input type="date" name="effective_to" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm" id="id_effective_to">
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_working_weekdays">
        روزهای کاری ISO<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <input type="text" name="working_weekdays" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm" aria-describedby="id_working_weekdays-help" required id="id_working_weekdays">
    
        <p class="erp-field-help mt-1 text-sm text-slate-500" id="id_working_weekdays-help">نمونه: 1,2,3,4,5</p>
    
    
</div>

    <div class="flex flex-wrap gap-3 border-t border-slate-100 pt-5"><button class="erp-btn erp-btn--primary" type="submit">ثبت کنترل‌شده</button><a class="erp-btn erp-btn--secondary" href="/timekeeping/">بازگشت</a></div>
  </form>
</section>

        </main>
