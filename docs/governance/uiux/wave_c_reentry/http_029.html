    </div>

<section class="erp-surface mx-auto mt-5 max-w-3xl rounded-2xl p-5 sm:p-7">
  <form method="post" class="space-y-4" novalidate>
    <!-- CSRF omitted -->
    
    
<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_idempotency_key">
        کلید یکتای درخواست<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <input type="text" name="idempotency_key" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm" required id="id_idempotency_key">
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_source_label">
        عنوان منبع<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <input type="text" name="source_label" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm" required id="id_source_label">
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_rows_json">

    </label>

</textarea>
    
    
</div>

  </form>
