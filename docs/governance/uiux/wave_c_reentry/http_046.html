<nav class="mb-3 flex items-center gap-2 text-[11px] text-slate-400" aria-label="مسیر صفحه">
    <a class="transition hover:text-blue-700" href="/">خانه</a>
    <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    
    <span class="truncate text-slate-600">تهیه تحویل مالی حقوق</span>
</nav>
<header class="erp-page-header" aria-labelledby="erp-page-title">
    <div class="erp-page-header__copy">
        
            <p class="text-xs font-semibold text-blue-600">حقوق و دستمزد محرمانه</p>
        
        <h1 id="erp-page-title" class="mt-1 text-2xl font-bold tracking-tight text-slate-950">تهیه تحویل مالی حقوق</h1>
        
            <p class="mt-1 text-sm text-slate-500">خروجی فقط پیشنهاد Payroll است و AP، دفترکل، خزانه یا هزینه واقعی پروژه را تغییر نمی‌دهد.</p>
        
    </div>
    
</header>

<section class="erp-surface mx-auto mt-5 max-w-3xl rounded-2xl p-5 sm:p-7">
  <form method="post" class="space-y-4" novalidate>
    <!-- CSRF omitted -->
    
    
<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_run">
        اجرای قطعی حقوق<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <select name="run" required id="id_run">
  <option value="" selected>---------</option>

</select>
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_family">
        خانواده تحویل<span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <select name="family" id="id_family">
  <option value="liability">پیشنهاد بدهی / AP</option>

  <option value="accounting">پیشنهاد منبع حسابداری</option>

  <option value="payment">پیشنهاد پرداخت خزانه</option>

  <option value="project_cost">پیشنهاد هزینه کار پروژه</option>

</select>
    
    
</div>
<input type="hidden" name="idempotency_key" value="e3a5b211-7568-4a17-b658-482c91cd0fc6" id="id_idempotency_key">
<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_proposed_accounting_date">
        تاریخ پیشنهادی حسابداری
    </label>
    <input type="date" name="proposed_accounting_date" id="id_proposed_accounting_date">
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_mapping_reference">
        مرجع نگاشت صریح
    </label>
    <input type="text" name="mapping_reference" maxlength="255" id="id_mapping_reference">
    
    
</div>

<div class="erp-form-field">
    <label class="mb-1.5 block text-sm font-medium text-slate-700" for="id_reason">
        دلیل
        <span class="erp-required" aria-hidden="true" title="الزامی">*</span><span class="sr-only"> (الزامی)</span>
    </label>
    <textarea name="reason" cols="40" rows="3" required id="id_reason">
</textarea>
    
    
</div>

    <div class="flex flex-wrap gap-3 border-t border-slate-100 pt-5"><button class="erp-btn erp-btn--primary" type="submit">ثبت کنترل‌شده</button><a class="erp-btn erp-btn--secondary" href="/payroll/">بازگشت</a></div>
  </form>
</section>
