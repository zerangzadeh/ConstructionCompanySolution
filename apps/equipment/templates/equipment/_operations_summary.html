<div class="border-b border-slate-100 px-4 py-3 odd:border-l md:border-b-0 md:border-l md:last:border-l-0">
    <dt class="text-xs font-semibold text-slate-500">{{ label }}</dt>
    <dd class="mt-1 flex flex-wrap items-baseline gap-x-2"><span class="text-2xl font-bold tabular-nums text-slate-900">{{ count|erp_quantity_fa }}</span><span class="text-xs text-slate-600">{{ unit }}</span></dd>
    <dd class="mt-1 text-xs text-slate-500">{{ secondary_count|erp_quantity_fa }} {{ secondary_unit }}</dd>
</div>
