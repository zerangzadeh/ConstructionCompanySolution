<dialog id="{{ dialog_id }}" class="pc-dialog" aria-labelledby="{{ dialog_id }}-title"><form method="post" action="{% url action_name certificate.pk %}">{% csrf_token %}<h2 id="{{ dialog_id }}-title">{{ action_label }}</h2><p>گواهی {{ certificate.certificate_number }} / ویرایش {{ certificate.revision_number }}</p><div class="pc-field"><label for="{{ dialog_id }}-reason">دلیل تصمیم (الزامی)</label><textarea id="{{ dialog_id }}-reason" class="erp-input" name="reason" required rows="4"></textarea></div><div class="pc-dialog-actions"><button class="erp-btn erp-btn--primary" type="submit">{{ action_label }}</button><button class="erp-btn erp-btn--secondary" type="button" data-pc-close>انصراف</button></div></form></dialog>
