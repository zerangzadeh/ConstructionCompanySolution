<div class="mt-3 space-y-3 border-t border-slate-100 pt-3">
  <form method="post" action="{% url 'daily_reports:field_proposal_review' proposal.observation_id proposal.id 'accept' %}">
    {% csrf_token %}
    <input type="hidden" name="operation_key" value="{{ review_form.operation_key.value }}">
    <button class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2" type="submit">پذیرش پیشنهاد</button>
  </form>
  <form class="space-y-3" method="post" action="{% url 'daily_reports:field_proposal_review' proposal.observation_id proposal.id 'reject' %}">
    {% csrf_token %}
    {{ review_form.operation_key }}
    {% include "components/form_field.html" with field=review_form.reason only %}
    <button class="rounded-lg bg-rose-600 px-3 py-2 text-sm font-semibold text-white focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2" type="submit">رد پیشنهاد</button>
  </form>
</div>
