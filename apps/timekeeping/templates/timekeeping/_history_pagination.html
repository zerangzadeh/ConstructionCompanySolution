{% if history.page.paginator.num_pages > 1 %}<nav class="mt-4 flex flex-wrap items-center gap-3 text-xs" aria-label="صفحه‌بندی سوابق"><span>صفحه {{ history.page.number }} از {{ history.page.paginator.num_pages }} · {{ history.page.paginator.count }} سابقه</span>{% if history.page.has_previous %}<a class="erp-btn erp-btn--secondary" href="{{ history.prefix }}{{ history.key }}={{ history.page.previous_page_number }}">قبلی</a>{% endif %}{% if history.page.has_next %}<a class="erp-btn erp-btn--secondary" href="{{ history.prefix }}{{ history.key }}={{ history.page.next_page_number }}">بعدی</a>{% endif %}</nav>{% endif %}
