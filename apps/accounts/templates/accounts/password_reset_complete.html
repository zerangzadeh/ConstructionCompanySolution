{% extends "base.html" %}

{% block title %}گذرواژه به‌روزرسانی شد | بنیرا{% endblock %}

{% block content %}
<section class="mx-auto max-w-md rounded-2xl border border-[var(--bonira-light-gray,#E5ECF4)] bg-white p-6 text-center shadow-sm sm:p-8" aria-labelledby="password-reset-complete-title">
    <p class="text-xs font-bold text-[var(--bonira-royal-blue,#1563D6)]">بنیرا</p>
    <h1 id="password-reset-complete-title" class="mt-2 text-2xl font-bold text-[var(--bonira-deep-navy,#0E2746)]">گذرواژه شما به‌روزرسانی شد</h1>
    <p class="mt-3 text-sm leading-7 text-[var(--bonira-slate,#475569)]">اکنون می‌توانید با گذرواژه جدید وارد سامانه شوید.</p>
    <a class="erp-btn erp-btn--primary mt-6 w-full" href="{% url 'accounts:login' %}">ورود به سامانه</a>
</section>
{% endblock %}
