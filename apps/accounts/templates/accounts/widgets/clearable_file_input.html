{% if widget.is_initial %}
<div class="clearable-file-input">
    <div class="clearable-file-input__existing">
        <a class="clearable-file-input__filename" href="{{ widget.value.url }}" target="_blank" rel="noopener" aria-label="مشاهده تصویر فعلی">مشاهده تصویر فعلی</a>
        {% if not widget.required %}
            <span class="clearable-file-input__clear">
            <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
            <label for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label }}</label>
            </span>
        {% endif %}
    </div>
    <div class="clearable-file-input__replacement">
        <span class="clearable-file-input__label">انتخاب تصویر جدید:</span>
        <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
    </div>
</div>
{% else %}
    <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
{% endif %}
