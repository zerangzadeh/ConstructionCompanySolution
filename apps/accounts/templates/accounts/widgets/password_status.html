<div class="erp-password-status"{% include "django/forms/widgets/attrs.html" %}>
  <div class="erp-password-status__copy">
    {% if password_is_usable %}
      <strong>گذرواژه تنظیم شده است.</strong>
      <span>برای حفظ امنیت، جزئیات گذرواژه نمایش داده نمی‌شود.</span>
    {% else %}
      <strong>گذرواژه‌ای تنظیم نشده است.</strong>
      <span>برای فعال‌سازی ورود با گذرواژه، آن را تنظیم کنید.</span>
    {% endif %}
  </div>
  <div class="erp-password-status__action">
    <a class="button" href="{{ password_url|default:"../password/" }}">{{ button_label }}</a>
  </div>
</div>
