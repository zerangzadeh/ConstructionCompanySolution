{% if links %}
<nav class="mt-4 flex gap-2 overflow-x-auto" aria-label="بخش‌های نیروهای کار" data-workforce-navigation>
  {% for link in links %}
    {% if link.current or link.active and current_as_label %}
      <span class="inline-flex shrink-0 items-center whitespace-nowrap border-b-2 border-blue-600 px-3 py-2 text-sm font-semibold text-blue-700" aria-current="page">{{ link.label }}</span>
    {% else %}
      <a class="erp-btn erp-btn--secondary shrink-0 whitespace-nowrap{% if link.active %} erp-btn--active{% endif %}" href="{{ link.url }}"{% if link.active %} aria-current="location"{% endif %}>{{ link.label }}</a>
    {% endif %}
  {% endfor %}
</nav>
{% endif %}
