{% if links %}
    <nav class="flex flex-wrap gap-2 {% if header_actions %}erp-record-journeys{% else %}mt-4{% endif %}" aria-label="{% if header_actions %}دسترسی‌های مرتبط با کارگاه{% else %}عملیات نیروی کار{% endif %}">
        {% for link in links %}
            <a class="erp-btn {% if header_actions and forloop.first %}erp-btn--primary{% else %}erp-btn--secondary{% endif %}" href="{{ link.url }}">
                {% if header_actions %}{% include "components/form_icon.html" with icon=link.icon only %}{% endif %}
                {{ link.label }}
            </a>
        {% endfor %}
    </nav>
{% endif %}
