{% extends "base.html" %}

{% block title %}Accept invitation | Construction ERP{% endblock %}

{% block content %}
    <div class="mx-auto max-w-xl">
        <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8">
            <h1 class="text-2xl font-bold">Accept invitation</h1>
            {% if error %}
                <p class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
            {% else %}
                <p class="mt-2 text-sm text-slate-500">Confirm that you want to join this organization.</p>
            {% endif %}
            <form method="post" class="mt-6">
                {% csrf_token %}
                <input type="hidden" name="token" value="{{ token }}">
                <button class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white hover:bg-blue-700" type="submit">
                    Accept invitation
                </button>
            </form>
        </div>
    </div>
{% endblock %}
