{% if user.profile_image %}
    <img class="{{ avatar_classes }} rounded-full border border-slate-200 object-cover" src="{% url 'accounts:profile-image' %}?v={{ user.profile_image_version }}" alt="{% if describe_avatar %}تصویر پروفایل {{ user.get_full_name|default:user.username }}{% endif %}">
{% else %}
    <span class="{{ avatar_classes }} grid shrink-0 place-items-center rounded-full bg-blue-700 text-white {% if describe_avatar %}text-xl font-bold{% else %}text-sm font-semibold{% endif %}" aria-hidden="true">{{ user.username|first|upper }}</span>
{% endif %}
