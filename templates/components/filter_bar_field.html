<div class="min-w-0 flex-1{% if field.name == 'side' %} lg:min-w-48{% else %} lg:min-w-32{% endif %}">
    <label class="mb-1.5 block text-xs font-semibold text-slate-600" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}<p class="mt-1 text-xs text-red-700" role="alert">{{ error }}</p>{% endfor %}
</div>
