{% if form.errors %}
    <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" data-form-errors tabindex="-1" role="alert">
        <p class="mb-1 text-xs font-semibold">لطفاً موارد زیر را بررسی کنید:</p>
        {{ form.non_field_errors }}
        {% for field in form %}{% if field.errors %}<p><a class="underline" href="#{{ field.id_for_label }}">{{ field.label }}</a>: {{ field.errors|striptags }}</p>{% endif %}{% endfor %}
    </div>
{% endif %}
