<div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
        {% if page_eyebrow %}
            <p class="text-sm font-medium text-blue-600">{{ page_eyebrow }}</p>
        {% endif %}
        <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-900">{{ page_title }}</h1>
        {% if page_description %}
            <p class="mt-2 text-slate-500">{{ page_description }}</p>
        {% endif %}
    </div>
    {% if page_action_url and page_action_label %}
        <a class="inline-flex shrink-0 items-center justify-center rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white hover:bg-blue-700" href="{{ page_action_url }}">
            {{ page_action_label }}
        </a>
    {% endif %}
</div>
