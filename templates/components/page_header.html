<header class="erp-page-header" aria-labelledby="erp-page-title">
    <div class="erp-page-header__copy">
        {% if page_eyebrow %}
            <p class="text-xs font-semibold text-blue-600">{{ page_eyebrow }}</p>
        {% endif %}
        <h1 id="erp-page-title" class="mt-1 text-2xl font-bold tracking-tight text-slate-950 sm:text-3xl">{{ page_title }}</h1>
        {% if page_description %}
            <p class="mt-1 text-sm text-slate-500">{{ page_description }}</p>
        {% endif %}
    </div>
    {% if page_action_url and page_action_label %}
        <a class="erp-page-header__action inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 text-sm font-semibold text-white shadow-sm shadow-blue-200 transition hover:bg-blue-700" href="{{ page_action_url }}">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>{{ page_action_label }}
        </a>
    {% endif %}
</header>
