<section class="erp-system-state erp-surface rounded-xl p-6 sm:p-8" aria-labelledby="system-state-title">
    <span class="erp-system-state__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">{% if state == 'permission' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>{% elif state == 'error' %}<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3v1"/>{% else %}<path d="M4 5h16v15H4zM8 9h8m-8 4h5"/>{% endif %}</svg></span>
    <h1 id="system-state-title" class="text-lg font-bold text-slate-900">{{ title }}</h1>
    <p class="mt-3 text-sm leading-7 text-slate-600">{{ description }}</p>
    <a class="erp-btn erp-btn--secondary mt-5" href="{% url 'home' %}">بازگشت به خانه</a>
</section>
