{% if filters %}
<tr class="bg-slate-50/70 align-top text-right">
    {% for filter in filters %}
    <th class="border-b border-slate-200 px-3 pb-3 pt-1 font-normal">
        {% if filter %}
            {% if filter.kind != "date_range" %}<label class="sr-only" for="{{ form_id }}-{{ filter.name }}">فیلتر {{ filter.label }}</label>{% endif %}
            {% if filter.kind == "select" %}
                <select id="{{ form_id }}-{{ filter.name }}" name="{{ filter.name }}" form="{{ form_id }}" class="h-8 w-full min-w-24 rounded-md border border-slate-200 bg-white px-2 text-[11px] font-medium text-slate-700 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                    <option value="">همه</option>
                    {% for value, label in filter.choices %}<option value="{{ value }}"{% if filter.value == value %} selected{% endif %}>{{ label }}</option>{% endfor %}
                </select>
            {% elif filter.kind == "date_range" %}
                <div class="grid min-w-36 grid-cols-2 gap-1">
                    <label class="sr-only" for="{{ form_id }}-{{ filter.name }}-from">فیلتر {{ filter.label }} از</label>
                    <input id="{{ form_id }}-{{ filter.name }}-from" name="{{ filter.name }}_from" form="{{ form_id }}" value="{{ filter.from_value }}" data-jalali-date="date" class="h-8 min-w-0 rounded-md border border-slate-200 bg-white px-2 text-[10px] font-medium text-slate-700 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100" placeholder="از">
                    <label class="sr-only" for="{{ form_id }}-{{ filter.name }}-to">فیلتر {{ filter.label }} تا</label>
                    <input id="{{ form_id }}-{{ filter.name }}-to" name="{{ filter.name }}_to" form="{{ form_id }}" value="{{ filter.to_value }}" data-jalali-date="date" class="h-8 min-w-0 rounded-md border border-slate-200 bg-white px-2 text-[10px] font-medium text-slate-700 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100" placeholder="تا">
                </div>
            {% else %}
                <input id="{{ form_id }}-{{ filter.name }}" type="search" name="{{ filter.name }}" form="{{ form_id }}" value="{{ filter.value }}" class="h-8 w-full min-w-24 rounded-md border border-slate-200 bg-white px-2 text-[11px] font-medium text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100" placeholder="جست‌وجو">
            {% endif %}
        {% endif %}
    </th>
    {% endfor %}
</tr>
{% endif %}
