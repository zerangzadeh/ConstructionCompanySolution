{% if messages %}
    <div class="erp-messages mb-6 space-y-3" data-feedback-messages>
        {% for message in messages %}
            <div data-feedback-level="{% if 'error' in message.tags %}error{% elif 'warning' in message.tags %}warning{% elif 'success' in message.tags %}success{% else %}info{% endif %}" class="erp-message rounded-xl border px-4 py-3 text-sm shadow-sm {% if 'error' in message.tags %}erp-message--error border-red-200 bg-red-50 text-red-700{% elif 'warning' in message.tags %}erp-message--warning border-amber-200 bg-amber-50 text-amber-800{% elif 'success' in message.tags %}erp-message--success border-emerald-200 bg-emerald-50 text-emerald-700{% else %}erp-message--info border-blue-200 bg-blue-50 text-blue-700{% endif %}">
                <span class="erp-message__icon" aria-hidden="true">{% if 'error' in message.tags %}!{% elif 'warning' in message.tags %}!{% elif 'success' in message.tags %}✓{% else %}i{% endif %}</span><span data-feedback-text>{{ message|force_escape }}</span>
            </div>
        {% endfor %}
    </div>
{% endif %}
