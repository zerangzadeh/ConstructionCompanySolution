{% if messages %}
    <div class="erp-messages mb-6 space-y-3" aria-live="polite">
        {% for message in messages %}
            <div class="erp-message rounded-xl border px-4 py-3 text-sm shadow-sm {% if 'error' in message.tags %}erp-message--error border-red-200 bg-red-50 text-red-700{% elif 'warning' in message.tags %}erp-message--warning border-amber-200 bg-amber-50 text-amber-800{% elif 'success' in message.tags %}erp-message--success border-emerald-200 bg-emerald-50 text-emerald-700{% else %}erp-message--info border-blue-200 bg-blue-50 text-blue-700{% endif %}" role="{% if 'error' in message.tags or 'warning' in message.tags %}alert{% else %}status{% endif %}">
                <span class="erp-message__icon" aria-hidden="true">{% if 'error' in message.tags %}!{% elif 'warning' in message.tags %}!{% elif 'success' in message.tags %}✓{% else %}i{% endif %}</span><span>{{ message }}</span>
            </div>
        {% endfor %}
    </div>
{% endif %}
