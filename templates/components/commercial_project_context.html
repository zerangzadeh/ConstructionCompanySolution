{% if selected_project %}
<div class="erp-surface mt-4 flex flex-wrap items-center justify-between gap-3 rounded-xl p-4" aria-label="زمینه پروژه">
    <p class="text-sm text-slate-700">پروژه: <strong>{{ selected_project.name }}</strong><span class="mt-1 block text-xs text-slate-500">فهرست به سوابق قابل مشاهده این پروژه محدود است.</span></p>
    <a class="text-xs font-semibold text-blue-700 hover:underline" href="{% url 'projects:detail' selected_project.pk %}#commercial-summary">بازگشت به پروژه ←</a>
</div>
{% if filter_form %}<input type="hidden" name="project_id" value="{{ selected_project.pk }}" form="{{ filter_form }}">{% endif %}
{% endif %}
