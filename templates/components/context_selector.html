<section class="border-b border-slate-200 bg-slate-50/95" aria-label="انتخاب پروژه و کارگاه">
    <form class="mx-auto flex max-w-[1600px] flex-wrap items-end gap-2 px-4 py-2 sm:px-6 lg:px-8" method="post" action="{% url 'organizations:update_context' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <div class="min-w-44 flex-1 sm:flex-none">
            <span class="mb-1 block text-[10px] font-semibold text-slate-500">شرکت</span>
            <span class="flex min-h-9 items-center rounded-lg border border-slate-200 bg-white px-3 text-xs font-semibold text-slate-800">{{ request.organization.name }}</span>
        </div>
        <label class="min-w-48 flex-1 sm:flex-none">
            <span class="mb-1 block text-[10px] font-semibold text-slate-500">پروژه{% if context_requires_project %} <span class="text-rose-600">(برای این عملیات الزامی)</span>{% endif %}</span>
            <select class="min-h-9 min-w-0 max-w-full rounded-lg border border-slate-200 bg-white px-3 text-xs text-slate-800" name="project_id" data-context-project>
                <option value="">همه پروژه‌های در دسترس</option>
                {% for project in context_projects %}<option value="{{ project.pk }}"{% if active_project.pk == project.pk %} selected{% endif %}>{{ project.code }} — {{ project.name }}</option>{% endfor %}
            </select>
        </label>
        {% if site_context_relevant %}
            <label class="min-w-48 flex-1 sm:flex-none">
                <span class="mb-1 block text-[10px] font-semibold text-slate-500">کارگاه مرتبط</span>
                <select class="min-h-9 min-w-0 max-w-full rounded-lg border border-slate-200 bg-white px-3 text-xs text-slate-800" name="site_id" data-context-site{% if not active_project %} disabled{% endif %}>
                    <option value="">بدون کارگاه</option>
                    {% for site in context_sites %}<option value="{{ site.pk }}"{% if active_site.pk == site.pk %} selected{% endif %}>{{ site.code }} — {{ site.name }}</option>{% endfor %}
                </select>
            </label>
        {% endif %}
        <button class="erp-btn erp-btn--secondary erp-btn--compact min-h-9" type="submit">انتخاب پروژه و کارگاه</button>
        {% if context_requires_project and not active_project %}
            <p class="w-full text-[11px] text-amber-700" role="status">پروژه‌ای انتخاب نشده است؛ برای ثبت اطلاعات، پروژه را از این بخش یا در فرم انتخاب کنید.</p>
        {% endif %}
    </form>
</section>
