{% if navigation_is_authenticated %}
    <a class="{{ navigation_link_class }}" href="{% url 'organizations:select' %}">Organizations</a>
    <a class="{{ navigation_link_class }}" href="{% url 'organizations:members' %}">Members</a>
    <a class="{{ navigation_link_class }}" href="{% url 'organizations:invite' %}">Invite</a>

        {% csrf_token %}

{% else %}
    <a class="{{ navigation_primary_class }}" href="{% url 'accounts:login' %}">Sign in</a>
{% endif %}
