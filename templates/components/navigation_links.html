{% if navigation_is_authenticated %}
<nav class="erp-nav" aria-label="ناوبری اصلی" data-product-navigation="MVP-01">
    <a data-nav-id="NAV-001" class="erp-nav-link{% if current_url_name == 'home' %} is-active{% endif %}" href="{% url 'home' %}">خانه</a>
    {% for group in product_navigation_groups %}
    <details data-surface-group="{{ group.key }}" class="erp-nav-group" open>
        <summary><span>{{ group.label }}</span><span aria-hidden="true">⌄</span></summary>
        <div class="erp-nav-group__items">
            {% for link in group.links %}
            <a class="erp-nav-link{% if current_view_name == link.route %} is-active{% endif %}" href="{% url link.route %}">{{ link.label }}</a>
            {% endfor %}
        </div>
    </details>
    {% endfor %}
    {% if not product_navigation_groups %}<a class="erp-nav-link" href="{% url 'accounts:settings' %}">پروفایل کاربر</a>{% endif %}
</nav>
{% else %}<a class="rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white hover:bg-blue-700" href="{% url 'accounts:login' %}">ورود</a>{% endif %}
