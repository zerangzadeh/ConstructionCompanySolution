{% load erp_format %}
<figure class="erp-project-chart{% if ring %} erp-project-chart--ring{% endif %}" aria-labelledby="{{ chart_id }}-title">
    <figcaption>{% if icon %}{% include "components/form_icon.html" with icon=icon only %}{% endif %}<h2 id="{{ chart_id }}-title">{{ title }}</h2><p>{{ description }}</p></figcaption>
    {% if rows %}
    <div class="erp-project-chart__body">
    {% if render_chart != False %}<div class="erp-project-chart__canvas"><canvas id="{{ chart_id }}" role="img" aria-label="{{ title }}" aria-describedby="{{ chart_id }}-values" hidden>مقادیر نمودار در فهرست زیر آمده است.</canvas>{% if ring %}<div class="erp-project-chart__center" aria-hidden="true"><strong>{{ total|erp_number }}</strong><span>{{ unit }}</span></div>{% endif %}</div>{% endif %}
    <dl id="{{ chart_id }}-values" class="erp-project-chart__values">{% for row in rows %}<div{% if row.status %} data-chart-status="{{ row.status }}"{% endif %}><dt>{{ row.label }}</dt><dd><bdi dir="ltr">{{ row.value|erp_number }}</bdi>{% if unit and not ring %} <span>{{ unit }}</span>{% endif %}</dd></div>{% endfor %}</dl>
    </div>
    {% else %}<div class="erp-project-chart__empty"><span aria-hidden="true">—</span><p>{{ empty_message }}</p></div>{% endif %}
</figure>
