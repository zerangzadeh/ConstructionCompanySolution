{% if filters %}
<div class="flex items-center justify-end gap-2 border-b border-slate-100 bg-white px-4 py-2">
    <form id="{{ form_id }}" method="get" class="flex items-center gap-2" aria-label="فیلترهای جدول">
        <button class="h-8 rounded-md border border-slate-200 bg-white px-2.5 text-[11px] font-semibold text-slate-700 transition hover:border-blue-300 hover:text-blue-700" type="submit">اعمال فیلتر</button>
        {% if has_active_filters %}<a class="text-[11px] font-semibold text-slate-500 transition hover:text-red-700" href="{{ request.path }}">پاک‌سازی</a>{% endif %}
    </form>
</div>
{% endif %}
