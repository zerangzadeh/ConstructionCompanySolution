<div class="px-6 py-14 text-center">
    <span class="mx-auto grid h-11 w-11 place-items-center rounded-lg border border-slate-200 bg-slate-50 text-slate-400" aria-hidden="true">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14v16H5V4Zm3 4h8m-8 4h8m-8 4h5"/></svg>
    </span>
    <h2 class="mt-3 text-sm font-semibold text-slate-900">{{ empty_title }}</h2>
    {% if empty_description %}<p class="mx-auto mt-1 max-w-md text-xs leading-6 text-slate-500">{{ empty_description }}</p>{% endif %}
    {% if empty_action_url and empty_action_label %}<a class="erp-btn erp-btn--primary mt-4" href="{{ empty_action_url }}">{{ empty_action_label }}</a>{% endif %}
</div>
