{% if filters %}
<div class="mb-3 flex items-center justify-end gap-2" data-table-filter-controls="{{ form_id }}">
    <form id="{{ form_id }}" method="get" class="flex items-center gap-2" aria-label="فیلترهای جدول" data-table-filter-form>
        {% for name, value in filter_context.items %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
        <button class="h-8 rounded-md border border-slate-200 bg-white px-2.5 text-[11px] font-semibold text-slate-700 transition hover:border-blue-300 hover:text-blue-700" type="submit">اعمال فیلتر</button>
        {% if has_active_filters %}<a class="text-[11px] font-semibold text-slate-500 transition hover:text-red-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" href="{{ clear_filters_url|default:request.path }}" data-table-filter-clear{% if clear_filters_url %} data-context-preserving-clear{% endif %}>{% if clear_filters_url %}پاک‌کردن فیلترها{% else %}پاک‌سازی{% endif %}</a>{% endif %}
    </form>
</div>
<template id="{{ form_id }}-row">{% include "components/table_filter_row.html" with filters=filters form_id=form_id only %}</template>
{% endif %}
