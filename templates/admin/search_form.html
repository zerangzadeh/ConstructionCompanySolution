{% load i18n static %}
{% if cl.search_fields %}
<div id="toolbar">
  <form id="changelist-search" method="get" role="search">
    <div class="erp-admin-search-row">
      <label for="searchbar"><img src="{% static 'admin/img/search.svg' %}" alt="جست‌وجو"></label>
      <input type="text" size="40" name="{{ search_var }}" value="{{ cl.query }}" id="searchbar" placeholder="جست‌وجو"{% if cl.search_help_text %} aria-describedby="searchbar_helptext"{% endif %}>
      <input type="submit" value="جست‌وجو">
      {% if show_result_count %}<span class="small quiet erp-admin-search-count">{{ cl.result_count }} مورد</span>{% endif %}
    </div>
    {% for pair in cl.params.items %}{% if pair.0 != search_var %}<input type="hidden" name="{{ pair.0 }}" value="{{ pair.1 }}">{% endif %}{% endfor %}
    {% if cl.search_help_text %}<div class="help" id="searchbar_helptext">{{ cl.search_help_text }}</div>{% endif %}
  </form>
</div>
{% endif %}
