{% extends "base.html" %}
{% block title %}پذیرش دعوت‌نامه درگاه تأمین‌کننده{% endblock %}
{% block content %}<section class="mx-auto max-w-lg" aria-labelledby="portal-title"><section class="erp-surface rounded-xl p-5 sm:p-6"><p class="text-xs font-semibold text-blue-700">درگاه تأمین‌کننده</p><h1 id="portal-title" class="mt-1 text-2xl font-bold text-slate-950">پذیرش دعوت‌نامه</h1><p class="mt-2 text-sm text-slate-600">این دعوت‌نامه فقط برای حساب و ایمیل دعوت‌شده و همان استعلام معتبر است.</p><form method="post" class="mt-6 space-y-4">{% csrf_token %}<label for="portal-token" class="block text-sm font-medium">کد دعوت‌نامه</label><input id="portal-token" name="token" required autocomplete="one-time-code" class="block w-full rounded-lg border border-slate-300 px-3 py-2.5" dir="ltr"><button class="erp-btn erp-btn--primary w-full" type="submit">پذیرش و مشاهده استعلام</button></form></section></section>{% endblock %}
