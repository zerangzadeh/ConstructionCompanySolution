{% load form_accessibility %}
<div class="erp-form-field{% if field.errors %} erp-form-field--invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ label }}{% if field.field.required %}<span class="erp-required" aria-hidden="true">*</span><span class="sr-only"> (الزامی)</span>{% else %}<span class="estimate-field-optional">(اختیاری)</span>{% endif %}</label>
    {% accessible_field field %}
    {% if field.help_text %}<p class="erp-field-help" id="{{ field.auto_id }}-help">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<p class="erp-field-error" id="{{ field.auto_id }}-errors" role="alert">{{ field.errors|striptags }}</p>{% endif %}
</div>
