registry_update_rules:
  on_start:
  - Read registry before product mutation
  - Ground branch/HEAD/working tree and compare HEAD with repository_state.last_reconciled_head
  - Reconcile current CEP record with standing or explicit Human authority, repository evidence and accepted prior results
  - If HEAD changed, reconcile relevant Git integration metadata before product mutation
  - Preserve history; never silently rewrite contradictions
  on_material_event:
  - Update current CEP lifecycle state for STARTED/BLOCKED/PARTIAL/FAILED/RESUMED/COMPLETE/CLOSED_VERIFIED
  - Record blocker resolution, migration-state changes and material UTV changes
  - Record Git integration only from actual Git evidence
  - Apply standing authority and record objective Gate PASS only under governing policy; do not infer Human Sign-off or Production Certification
  on_closeout:
  - Update CEP record before issuing the final Completion Report
  - Update AC, DoD, blockers, UTV, evidence/report path, execution baseline SHA and Git state
  - Append history event
  - Recalculate summary counts from CEP records
  - Update ROADMAP.md only when delivery direction, sequencing or phase disposition materially changed
