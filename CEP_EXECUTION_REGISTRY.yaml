schema_version: 1
project: BONIRA
artifact_role: "Single authoritative current-state registry for controlled CEP execution"

governance:
  principles:
    - "ELIGIBLE != AUTHORIZED"
    - "EXECUTION_COMPLETION != GIT_INTEGRATION"
    - "UI_VISIBILITY != AUTHORIZATION"
    - "HISTORICAL_STATES_MUST_NOT_BE_SILENTLY_REWRITTEN"
  codex_update_policy:
    mandatory_at_session_start: true
    mandatory_on_material_lifecycle_event: true
    mandatory_at_closeout: true
    may_record_explicit_human_or_advisor_decisions: true
    may_independently_issue_human_authorization: false
    may_independently_mark_gate_pass: false
    may_independently_issue_human_signoff: false
    may_independently_issue_production_certification: false
    conflict_action: STOP_AND_REPORT_BLOCKER_REGISTRY_CONFLICT

inventory:
  total: 86
  current_governed: 79
  post_v1: 7
  v1_implementation: "CEP-001..CEP-068"
  production_certification: "CEP-069..CEP-072"
  verification_uat: "CEP-073..CEP-079"
  post_v1_range: "CEP-080..CEP-086"

summary:
  execution_state_complete: 20
  authorized_not_started: 1
  eligible_not_authorized: 11
  in_progress: 0
  blocked_current: 0
  not_started_other_current_governed: 47
  deferred_post_v1: 7
  remote_main_verified_complete_from_last_audit: 11
  last_updated: "2026-10-16"

gates:
  GATE-01:
    status: PASS
    source: ADVISOR_EVALUATION
    human_signoff_required: false
    updated_at: "2026-10-16"
  GATE-02:
    status: NOT_READY
    source: CURRENT_EXECUTION_PROJECTION
    note: "CEP-003, CEP-016 and CEP-017 are complete; CEP-014 and CEP-026 remain required contributors."
    updated_at: "2026-10-16"

authorization_batches:
  AUTH-BATCH-003:
    execution_mode: SERIAL
    ceps: [CEP-017, CEP-016, CEP-026]
    complete: [CEP-017, CEP-016]
    pending: [CEP-026]
    status: ACTIVE

registry_update_rules:
  on_start:
    - "Read registry"
    - "Reconcile current CEP record with explicit authorization and accepted prior results"
    - "Preserve history"
  on_material_event:
    - "Update current CEP lifecycle state"
    - "Record blocker/resolution/migration/UTV changes"
    - "Do not infer Human Authorization or Gate PASS"
  on_closeout:
    - "Update CEP record before final Completion Report"
    - "Update AC, DoD, blockers, UTV, evidence/report path, SHA, Git state"
    - "Append history event"
    - "Recalculate summary counts from CEP records"

