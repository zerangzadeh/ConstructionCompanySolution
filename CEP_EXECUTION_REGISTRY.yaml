schema_version: 1
project: BONIRA
artifact_role: Authoritative current-state registry for controlled CEP execution/lifecycle tracking
governance:
  principles:
  - ELIGIBLE != AUTHORIZED
  - EXECUTION_COMPLETION != GIT_INTEGRATION
  - UI_VISIBILITY != AUTHORIZATION
  - HISTORICAL_STATES_MUST_NOT_BE_SILENTLY_REWRITTEN
  codex_update_policy:
    mandatory_at_session_start: true
    mandatory_on_material_lifecycle_event: true
    mandatory_at_closeout: true
    may_record_explicit_human_or_advisor_decisions: true
    may_independently_issue_human_authorization: false
    may_independently_mark_gate_pass: false
    may_independently_issue_human_signoff: false
    may_independently_issue_production_certification: false
    conflict_action: STOP_AND_REPORT_BLOCKER_REGISTRY_CONFLICT
    mandatory_reconcile_if_head_changed: true
    mandatory_recalculate_summary_from_records: true
    roadmap_update_only_for_direction_or_disposition_change: true
    completion_report_is_execution_evidence_not_current_state_registry: true
inventory:
  total: 86
  current_governed: 79
  post_v1: 7
  v1_implementation: CEP-001..CEP-068
  production_certification: CEP-069..CEP-072
  verification_uat: CEP-073..CEP-079
  post_v1_range: CEP-080..CEP-086
summary:
  execution_state_complete: 21
  authorized_not_started: 0
  eligible_not_authorized: 11
  in_progress: 0
  blocked_current: 0
  not_started_other_current_governed: 47
  deferred_post_v1: 7
  remote_main_verified_complete_from_last_audit: null
  last_updated: '2026-10-16'
  remote_main_complete_count_status: REQUIRES_FULL_REPORT_RECONCILIATION
gates:
  GATE-01:
    status: PASS
    source: ADVISOR_EVALUATION
    human_signoff_required: false
    updated_at: '2026-10-16'
  GATE-02:
    status: NOT_READY
    source: CURRENT_EXECUTION_PROJECTION
    note: CEP-003, CEP-016, CEP-017 and CEP-026 contributions are complete; CEP-014 remains an outstanding required contributor.
      Eligibility does not grant authorization.
    updated_at: '2026-10-16'
authorization_batches:
  AUTH-BATCH-003:
    execution_mode: SERIAL
    ceps:
    - CEP-017
    - CEP-016
    - CEP-026
    complete:
    - CEP-017
    - CEP-016
    - CEP-026
    pending: []
    status: COMPLETE
registry_update_rules:
  on_start:
  - Read registry before product mutation
  - Ground branch/HEAD/working tree and compare HEAD with repository_state.last_reconciled_head
  - Reconcile current CEP record with explicit Human Authorization, repository evidence and accepted prior results
  - If HEAD changed, reconcile relevant Git integration metadata before product mutation
  - Preserve history; never silently rewrite contradictions
  on_material_event:
  - Update current CEP lifecycle state for STARTED/BLOCKED/PARTIAL/FAILED/RESUMED/COMPLETE/CLOSED_VERIFIED
  - Record blocker resolution, migration-state changes and material UTV changes
  - Record Git integration only from actual Git evidence
  - Do not infer Human Authorization, Gate PASS, Human Sign-off or Production Certification
  on_closeout:
  - Update CEP record before issuing the final Completion Report
  - Update AC, DoD, blockers, UTV, evidence/report path, execution baseline SHA and Git state
  - Append history event
  - Recalculate summary counts from CEP records
  - Update ROADMAP.md only when delivery direction, sequencing or phase disposition materially changed
