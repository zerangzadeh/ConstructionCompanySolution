schema_version: 1
project: BONIRA
artifact_role: Authoritative current-state registry for controlled CEP execution/lifecycle tracking
governance:
  principles:
  - AUTONOMY_BY_DEFAULT
  - HUMAN_ESCALATION_BY_MATERIAL_EXCEPTION
  - SERIAL_MULTI_CEP_EXECUTION
  - ELIGIBILITY_REQUIRES_STANDING_AUTHORITY_ENTRY_CHECKS_BEFORE_EXECUTION
  - EXECUTION_COMPLETION != GIT_INTEGRATION
  - UI_VISIBILITY != AUTHORIZATION
  - HISTORICAL_STATES_MUST_NOT_BE_SILENTLY_REWRITTEN
  codex_update_policy:
    mandatory_at_session_start: true
    mandatory_on_material_lifecycle_event: true
    mandatory_at_closeout: true
    may_record_explicit_human_or_advisor_decisions: true
    may_independently_issue_human_authorization: false
    may_record_objective_gate_pass_when_canonical_requirements_are_proved: true
    may_independently_issue_human_signoff: false
    may_independently_issue_production_certification: false
    conflict_action: STOP_AND_REPORT_BLOCKER_REGISTRY_CONFLICT
    mandatory_reconcile_if_head_changed: true
    mandatory_recalculate_summary_from_records: true
    roadmap_update_only_for_direction_or_disposition_change: true
    completion_report_is_execution_evidence_not_current_state_registry: true
  standing_non_production_execution_authority:
    status: ACTIVE
    source: HUMAN_DECISION_AUTHORITY / Product Owner
    effective_at: '2026-10-17'
    applies_to: CURRENT_GOVERNED_CEPS_WITH_SATISFIED_CANONICAL_ENTRY_CONDITIONS
    execution_mode: SERIAL_BY_DEFAULT
    fixed_cep_count_per_session: NONE
    routine_per_cep_human_authorization_required: false
    historical_per_cep_authorization_records_preserved: true
    excludes:
    - POST_V1_ACTIVATION
    - SCOPE_OR_PRODUCT_DECISION_OR_DEPENDENCY_GRAPH_CHANGE
    - PRODUCTION_DEPLOYMENT_CUTOVER_OR_IRREVERSIBLE_MIGRATION
    - HUMAN_SIGNOFF_OR_FINAL_PRODUCTION_CERTIFICATION
    - MATERIAL_RISK_ACCEPTANCE
    - GIT_WRITES_WITHOUT_SEPARATE_AUTHORITY
  objective_gate_policy:
    status: AUTOMATIC_WHEN_CANONICAL_REQUIREMENTS_ARE_PROVED
    human_decision_required_for:
    - PRODUCTION_APPROVAL_OR_CUTOVER
    - FINAL_PRODUCTION_CERTIFICATION
    - HUMAN_SIGNOFF
    - MATERIAL_RISK_ACCEPTANCE
    - MATERIAL_LEGAL_OR_BUSINESS_JUDGMENT
    - IRREVERSIBLE_PRODUCTION_ACTION
  per_cep_authorization_field_semantics:
    meaning: HISTORICAL_OR_PACKAGE_SPECIFIC_AUTHORITY_ONLY
    standing_authority_applies_independently: true
    not_authorized_value_does_not_negate_standing_authority: true
